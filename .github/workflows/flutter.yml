name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install marine_ais dependencies
        working-directory: packages/marine_ais
        run: dart pub get

      - name: Analyze FleetFlow app
        run: flutter analyze lib test

      - name: Analyze marine_ais package
        working-directory: packages/marine_ais
        run: dart analyze

      - name: Run FleetFlow tests
        run: flutter test

      - name: Run marine_ais tests
        working-directory: packages/marine_ais
        run: dart test

      - name: Build web app
        run: flutter build web --release
