name: fleet_flow
description: "Offshore race tracker for sailboats — connects to B&G Zeus3 and Cortex via AIS/NMEA"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  geolocator: ^13.0.2
  shared_preferences: ^2.3.0
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
